# Reusable: PR title must be a Conventional Commit (INF-112).
# Call: jobs.title.uses: PomegraIO/.github/.github/workflows/pr-title.yml@main
name: pr-title
on:
  workflow_call:
permissions:
  pull-requests: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            chore
            ci
            build
            revert
          requireScope: false
          # subject must not start with an uppercase letter ("[TAG] x" fails the type match already)
          subjectPattern: ^(?![A-Z\[]).+$
          subjectPatternError: |
            The subject "{subject}" in the PR title must start with a lower-case letter.
            Format: `type(scope): lower-case subject`, e.g. `feat(dm): detect ui mentions`.
            No [TAG] prefixes (use scope instead).
