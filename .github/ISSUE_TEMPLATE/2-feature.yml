name: Feature
description: New functionality or an improvement
type: Feature
projects: ["PomegraIO/1"]
body:
  - type: textarea
    id: why
    attributes: {label: Why, description: "The problem or the goal"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What, description: "The change, as concretely as possible"}
  - type: textarea
    id: done
    attributes: {label: Done when, description: "Checklist of acceptance criteria", value: "- [ ] "}
  - type: dropdown
    id: area
    attributes: {label: Area, options: ["infra","security","data","api","ui","bots","social","content","agents"]}
